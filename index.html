<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#251C35">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23FF539B'/%3E%3C/svg%3E">
<title>Shelly AR - שלי AR</title>
<style>
:root{--a1:#FF539B;--a2:#6A43B8;--base:#251C35;--glow:rgba(255,83,155,.35)}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;width:100%;overflow:hidden;position:fixed;inset:0;overscroll-behavior:none;touch-action:none;background:var(--base);color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Heebo,Rubik,Arial,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
.glass{background:rgba(20,18,30,.45);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.14)}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000}
#c{position:fixed;inset:0;width:100%;height:100%;z-index:1;touch-action:none;display:block}
#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 22px) 22px calc(env(safe-area-inset-bottom) + 24px);
 background:radial-gradient(120% 70% at 85% 0%,var(--a2) 0%,transparent 58%),radial-gradient(90% 60% at 0% 100%,var(--a1) 0%,transparent 55%),var(--base);transition:background .4s}
.toprow{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;font-size:16px;letter-spacing:.3px;display:flex;gap:8px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:linear-gradient(135deg,var(--a1),var(--a2))}
.hero{margin-top:auto}
.hero h1{font-size:40px;line-height:1.05;margin:0 0 10px;font-weight:800;letter-spacing:-.5px}
.hero p{margin:0;font-size:16px;line-height:1.5;opacity:.8}
.label{font-size:13px;opacity:.65;margin:24px 2px 10px}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -22px;padding:2px 22px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.card{flex:0 0 104px;scroll-snap-align:start;border-radius:22px;padding:8px 6px 10px;text-align:center;transition:transform .15s,background .15s;position:relative}
.card img{width:88px;height:88px;object-fit:contain;display:block;margin:auto}
.card span{font-size:14px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tag{position:absolute;top:6px;right:6px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff}
.card.on{background:rgba(255,255,255,.95);color:#111;border-color:#fff}
.card .add{width:88px;height:88px;display:grid;place-items:center;margin:auto;opacity:.85}
.card .add svg{width:34px;height:34px}
.cta{margin-top:20px;width:100%;height:62px;border-radius:20px;font-size:19px;font-weight:800;background:#fff;color:var(--base);box-shadow:0 10px 40px var(--glow);display:flex;gap:10px;align-items:center;justify-content:center}
.cta:active{transform:scale(.98)}
.note{font-size:12px;opacity:.55;text-align:center;margin-top:10px;min-height:16px}
.linkbtn{font-size:14px;opacity:.85;text-decoration:underline;margin-top:8px;align-self:center}
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
.topbar{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
.icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.icon:active,.act:active{transform:scale(.92)}
#hint{position:absolute;top:calc(env(safe-area-inset-top) + 70px);left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:16px;font-size:15px;font-weight:600;white-space:nowrap;transition:opacity .4s;pointer-events:none}
#heard{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 196px);left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:14px;font-size:15px;max-width:86%;text-align:center;transition:opacity .3s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bubble{position:fixed;z-index:9;max-width:min(78vw,320px);padding:12px 16px;border-radius:20px;background:#fff;color:#1a1625;font-size:16px;font-weight:600;line-height:1.45;
 transform:translate(-50%,-100%);pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:opacity .25s;border:2px solid var(--a1)}
#bubble::after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-9px;width:16px;height:16px;background:#fff;border-right:2px solid var(--a1);border-bottom:2px solid var(--a1);transform:rotate(45deg)}
#bubble .who{display:block;font-size:11px;font-weight:800;color:var(--a2);margin-bottom:2px;letter-spacing:.3px}
.bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);left:10px;right:10px;display:flex;flex-direction:column;align-items:center;gap:12px}
.mic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;position:relative;background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 30px var(--glow)}
.mic svg{width:32px;height:32px}
.mic.on::before,.mic.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid var(--a1);animation:pulse 1.4s ease-out infinite}
.mic.on::after{animation-delay:.7s}
.mic.talk{animation:breathe .6s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.6);opacity:0}}
@keyframes breathe{to{transform:scale(1.06)}}
.actions{display:flex;justify-content:space-between;gap:6px;width:100%;max-width:440px;padding:8px;border-radius:26px}
.act{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 7px;border-radius:18px;transition:transform .1s,background .15s}
.act svg{width:26px;height:26px}
.act small{font-size:11px;font-weight:600;opacity:.9}
.act:active{background:rgba(255,255,255,.18)}
.sheetBg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;border-radius:26px 26px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);background:rgba(22,20,32,.86);max-height:80vh;overflow:auto}
.sheet h3{margin:4px 0 6px;font-size:17px}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 14px}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:16px;gap:12px}
.row:last-child{border:0}
input[type=range]{width:55%;accent-color:var(--a1)}
.seg{display:flex;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.seg button{padding:8px 14px;font-size:14px}.seg button.on{background:#fff;color:#111}
.pill{padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.12);font-size:14px;display:flex;gap:6px;align-items:center}
.pill svg{width:18px;height:18px}
.pals{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:8px 0 4px}
.pal{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600}
.sw{width:54px;height:54px;border-radius:50%;position:relative;border:3px solid transparent;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.pal.on .sw{border-color:#fff}
.sw i{position:absolute;bottom:-2px;left:-2px;width:20px;height:20px;border-radius:50%;border:2px solid rgba(255,255,255,.9)}
.custom{position:relative;overflow:hidden;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)}
.custom input{position:absolute;inset:-10px;opacity:0;width:80px;height:80px;cursor:pointer}
#flash{position:fixed;inset:0;z-index:50;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#err{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.6)}
#err .box{border-radius:24px;padding:22px;max-width:360px;text-align:center;line-height:1.55}
#err h3{margin:0 0 8px;font-size:20px}
#loading{position:fixed;inset:0;z-index:25;display:grid;place-items:center;pointer-events:none}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
#mv{position:fixed;inset:0;z-index:70;background:#111}#mv model-viewer{width:100%;height:100%}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
</head><body>
<svg width="0" height="0" style="position:absolute">
 <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
 <symbol id="i-cam" viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3.5"/></symbol>
 <symbol id="i-set" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
 <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></symbol>
 <symbol id="i-jump" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
 <symbol id="i-dance" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
 <symbol id="i-hi" viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.5 8.5 0 1 1 21 11.5z"/></symbol>
 <symbol id="i-come" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></symbol>
 <symbol id="i-spin" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></symbol>
 <symbol id="i-pal" viewBox="0 0 24 24"><path d="M12 22a10 10 0 1 1 10-10c0 2.8-2.2 4-4 4h-2a2 2 0 0 0-1.5 3.3A1.7 1.7 0 0 1 12 22z"/><circle cx="7.5" cy="10.5" r="1"/><circle cx="12" cy="7" r="1"/><circle cx="16.5" cy="10.5" r="1"/></symbol>
 <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
 <symbol id="i-up" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
 <symbol id="i-swap" viewBox="0 0 24 24"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></symbol>
 <symbol id="i-cube" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.7z"/><path d="M3.3 7 12 12l8.7-5M12 22V12"/></symbol>
</svg>
<video id="video" playsinline webkit-playsinline muted autoplay></video>
<canvas id="c"></canvas>

<section id="start">
  <div class="toprow"><div class="brand"><span class="dot"></span>Shelly AR</div>
    <button class="icon glass" id="palBtn" aria-label="צבעים"><svg class="i"><use href="#i-pal"/></svg></button></div>
  <div class="hero">
    <h1>הדמות שלך<br>בעולם האמיתי</h1>
    <p>פותחים מצלמה, הדמות נעמדת מולך, זזה, רוקדת ומדברת איתך.</p>
  </div>
  <div class="label">בחרי דמות</div>
  <div class="carousel" id="carousel"></div>
  <button class="cta" id="go"><svg class="i"><use href="#i-cam"/></svg>פתחי מצלמה</button>
  <button class="linkbtn" id="goXR" hidden>AR מלא על משטח אמיתי (אנדרואיד)</button>
  <button class="linkbtn" id="goQL" hidden>תצוגת AR של אייפון (Quick Look)</button>
  <div class="note" id="note"></div>
  <input type="file" id="file" accept=".glb,model/gltf-binary,application/octet-stream" hidden>
</section>

<section id="hud" hidden>
  <div class="topbar">
    <button class="icon glass" id="close" aria-label="סגירה"><svg class="i"><use href="#i-x"/></svg></button>
    <div style="display:flex;gap:8px">
      <button class="icon glass" id="shot" aria-label="צילום"><svg class="i"><use href="#i-cam"/></svg></button>
      <button class="icon glass" id="settings" aria-label="הגדרות"><svg class="i"><use href="#i-set"/></svg></button>
    </div>
  </div>
  <div id="hint" class="glass">געי במסך כדי להעמיד את הדמות</div>
  <div id="heard" class="glass" style="opacity:0"></div>
  <div class="bottom">
    <button class="mic" id="mic" aria-label="לדבר עם הדמות"><svg class="i"><use href="#i-mic"/></svg></button>
    <div class="actions glass">
      <button class="act" data-a="jump"><svg class="i"><use href="#i-jump"/></svg><small>קפוץ</small></button>
      <button class="act" data-a="dance"><svg class="i"><use href="#i-dance"/></svg><small>רקוד</small></button>
      <button class="act" data-a="hello"><svg class="i"><use href="#i-hi"/></svg><small>שלום</small></button>
      <button class="act" data-a="come"><svg class="i"><use href="#i-come"/></svg><small>בוא</small></button>
      <button class="act" data-a="spin"><svg class="i"><use href="#i-spin"/></svg><small>סובב</small></button>
    </div>
  </div>
</section>
<div id="bubble" style="opacity:0"><span class="who" id="who"></span><span id="btext"></span></div>

<div class="sheetBg" id="sheetBg" hidden></div>
<section class="sheet glass" id="sheet" hidden>
  <div class="grab"></div>
  <div class="row"><span>גודל הדמות</span><input type="range" id="size" min="0.3" max="3" step="0.05" value="1"></div>
  <div class="row"><span>שפת זיהוי דיבור</span><div class="seg" id="lang"><button data-l="he-IL" class="on">עברית</button><button data-l="en-US">English</button></div></div>
  <div class="row"><span>קול הדמות</span><div class="seg" id="voiceOn"><button data-v="1" class="on">מדברת</button><button data-v="0">שקטה</button></div></div>
  <div class="row"><span>צבעי האפליקציה</span><button class="pill" id="palBtn2"><svg class="i"><use href="#i-pal"/></svg>בחירה</button></div>
  <div class="row"><span>דמות משלי (GLB)</span><button class="pill" id="upload2"><svg class="i"><use href="#i-up"/></svg>העלאה</button></div>
  <div class="row"><span>החלפת דמות</span><button class="pill" id="swap"><svg class="i"><use href="#i-swap"/></svg>הבאה</button></div>
</section>

<div class="sheetBg" id="palBg" hidden></div>
<section class="sheet glass" id="palSheet" hidden>
  <div class="grab"></div>
  <h3>צבעי האפליקציה</h3>
  <div class="pals" id="pals"></div>
</section>

<div id="loading" hidden><div class="spin"></div></div>
<div id="flash"></div>
<div id="err" hidden><div class="box glass"><h3 id="errT"></h3><div id="errB"></div><button class="cta" style="height:50px;font-size:16px" id="errOk">הבנתי</button></div></div>
<div id="mv" hidden><button class="icon glass" id="mvClose" style="position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;z-index:2"><svg class="i"><use href="#i-x"/></svg></button></div>
<script type="module" src="app.js"></script>
</body></html>
