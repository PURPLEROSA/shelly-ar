<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shelly AR · שלי AR</title>
<style>[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0b10;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Heebo,Arial,sans-serif}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#c{position:fixed;inset:0;z-index:1;touch-action:none}
#ui{position:fixed;inset:0;z-index:5;pointer-events:none}
#ui>*{pointer-events:auto}
#start{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;background:radial-gradient(circle at 30% 20%,#2a1650,#0b0b10 70%);text-align:center}
h1{margin:0;font-size:30px}.sub{opacity:.75;margin:0 0 8px;font-size:15px;line-height:1.5}
.btn{border:0;border-radius:16px;padding:14px 20px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,#ff2d6f,#7b2cff);min-width:240px}
.btn.alt{background:rgba(255,255,255,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;border-radius:999px;padding:9px 14px;font-size:14px}
.chip.on{background:#fff;color:#111}
#top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#000a,#0000)}
#msg{position:absolute;top:calc(env(safe-area-inset-top) + 60px);left:50%;transform:translateX(-50%);background:#000a;padding:8px 14px;border-radius:12px;font-size:14px;white-space:nowrap}
#bar{position:absolute;bottom:0;left:0;right:0;padding:10px 10px calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:6px;overflow-x:auto;background:linear-gradient(#0000,#000c)}
#bar button{flex:0 0 auto;border:0;border-radius:14px;padding:11px 13px;background:rgba(255,255,255,.16);color:#fff;font-size:15px;backdrop-filter:blur(8px)}
#mic.on{background:#ff2d6f}
.small{font-size:12px;opacity:.6}
#mv{position:fixed;inset:0;z-index:20;display:none;background:#111}
#mv model-viewer{width:100%;height:100%}
#mvClose{position:absolute;top:16px;left:16px;z-index:21}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
</head><body>
<video id="video" playsinline muted autoplay></video>
<canvas id="c"></canvas>
<div id="start">
  <h1>🦣 Shelly AR</h1>
  <p class="sub">פותחים מצלמה, מניחים דמות על השולחן –<br>והיא זזה, רוקדת ומגיבה לקול ולמגע.</p>
  <div class="chips" id="picker"></div>
  <label class="chip" style="cursor:pointer">📁 העלאת דמות משלי (GLB)<input type="file" id="file" accept=".glb,.gltf,model/gltf-binary" hidden></label>
  <div class="small" id="fileName"></div>
  <button class="btn" id="goXR" style="display:none">🚀 AR מלא (משטחים אמיתיים)</button>
  <button class="btn" id="goCam">📷 פתיחת מצלמה</button>
  <button class="btn alt" id="goQL" style="display:none">🍏 AR של אייפון (Quick Look)</button>
  <div class="small" id="support"></div>
</div>
<div id="ui" hidden>
  <div id="top"><b>Shelly AR</b><button class="chip" id="back">✕ יציאה</button></div>
  <div id="msg">הקישו על הרצפה כדי להציב דמות</div>
  <div id="bar">
    <button id="mic">🎤 קול</button>
    <button data-a="jump">🦘 קפוץ</button><button data-a="dance">💃 רקוד</button>
    <button data-a="wave">👋 שלום</button><button data-a="come">🚶 בוא</button>
    <button data-a="spin">🔄 סובב</button><button data-a="bigger">➕</button><button data-a="smaller">➖</button>
    <button data-a="reset">📍 הצב מחדש</button>
  </div>
</div>
<div id="mv"><button class="chip" id="mvClose">✕</button></div>
<script type="module" src="app.js"></script>
</body></html>
