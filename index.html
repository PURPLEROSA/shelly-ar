<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0a0a0f">
<title>Shelly AR · שלי AR</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;width:100%;overflow:hidden;position:fixed;inset:0;overscroll-behavior:none;touch-action:none;background:#0a0a0f;color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Heebo,Rubik,Arial,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.glass{background:rgba(20,20,28,.42);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);border:1px solid rgba(255,255,255,.14)}
#video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000}
#c{position:fixed;inset:0;width:100%;height:100%;z-index:1;touch-action:none;display:block}
/* start */
#start{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 28px) 22px calc(env(safe-area-inset-bottom) + 26px);
 background:radial-gradient(120% 70% at 85% 0%,#5b2bd6 0%,transparent 55%),radial-gradient(90% 60% at 0% 100%,#ff3d7f 0%,transparent 55%),#0a0a0f}
.brand{font-weight:800;font-size:15px;letter-spacing:.3px;opacity:.85}
.hero{margin-top:auto}
.hero h1{font-size:40px;line-height:1.05;margin:0 0 10px;font-weight:800;letter-spacing:-.5px}
.hero p{margin:0;font-size:16px;line-height:1.5;opacity:.75}
.label{font-size:13px;opacity:.6;margin:26px 2px 10px}
.carousel{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px;margin:0 -22px;padding-inline:22px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.card{flex:0 0 108px;scroll-snap-align:start;border-radius:22px;padding:8px 8px 10px;text-align:center;transition:transform .15s,background .15s;position:relative}
.card img{width:92px;height:92px;object-fit:contain;display:block;margin:auto}
.card span{font-size:14px;font-weight:600}
.card.on{background:rgba(255,255,255,.95);color:#111;border-color:#fff}
.card .add{width:92px;height:92px;display:grid;place-items:center;font-size:36px;margin:auto;opacity:.8}
.cta{margin-top:22px;width:100%;height:62px;border-radius:20px;font-size:19px;font-weight:800;background:#fff;color:#0a0a0f;box-shadow:0 10px 40px rgba(255,61,127,.35)}
.cta:active{transform:scale(.98)}
.note{font-size:12px;opacity:.5;text-align:center;margin-top:12px;min-height:16px}
.linkbtn{font-size:14px;opacity:.85;text-decoration:underline;margin-top:10px;align-self:center}
/* hud */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
.topbar{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:center}
.icon{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.icon:active,.act:active{transform:scale(.92)}
#hint{position:absolute;top:calc(env(safe-area-inset-top) + 70px);left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:16px;font-size:15px;font-weight:600;white-space:nowrap;transition:opacity .4s;pointer-events:none}
#heard{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 190px);left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:14px;font-size:15px;max-width:86%;text-align:center;transition:opacity .3s;pointer-events:none}
.bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);left:10px;right:10px;display:flex;flex-direction:column;align-items:center;gap:12px}
.mic{width:76px;height:76px;border-radius:50%;font-size:30px;display:grid;place-items:center;position:relative;background:linear-gradient(135deg,#ff3d7f,#7b3dff);box-shadow:0 8px 30px rgba(123,61,255,.5)}
.mic.on::before,.mic.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:3px solid rgba(255,61,127,.8);animation:pulse 1.4s ease-out infinite}
.mic.on::after{animation-delay:.7s}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.6);opacity:0}}
.actions{display:flex;justify-content:space-between;gap:6px;width:100%;max-width:440px;padding:8px;border-radius:26px}
.act{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:18px;font-size:26px;transition:transform .1s,background .15s}
.act small{font-size:11px;font-weight:600;opacity:.9}
.act:active{background:rgba(255,255,255,.18)}
/* sheet */
#sheetBg{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;border-radius:26px 26px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);background:rgba(22,22,30,.82)}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:0 auto 14px}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:16px;gap:12px}
.row:last-child{border:0}
input[type=range]{width:55%;accent-color:#ff3d7f}
.seg{display:flex;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,.2)}
.seg button{padding:8px 14px;font-size:14px}.seg button.on{background:#fff;color:#111}
.pill{padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.12);font-size:14px}
#flash{position:fixed;inset:0;z-index:50;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#err{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.6)}
#err .box{border-radius:24px;padding:22px;max-width:360px;text-align:center;line-height:1.55}
#err h3{margin:0 0 8px;font-size:20px}
#loading{position:fixed;inset:0;z-index:25;display:grid;place-items:center;pointer-events:none}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:#fff;animation:r 0.8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
#mv{position:fixed;inset:0;z-index:70;background:#111}#mv model-viewer{width:100%;height:100%}
</style>
<script type="importmap">{"imports":{"three":"./lib/three.module.js"}}</script>
</head><body>
<video id="video" playsinline webkit-playsinline muted autoplay></video>
<canvas id="c"></canvas>

<section id="start">
  <div class="brand">✦ Shelly AR</div>
  <div class="hero">
    <h1>הדמות שלך<br>בעולם האמיתי</h1>
    <p>פותחים מצלמה, הדמות נעמדת מולך – וזזה, רוקדת ומגיבה לקול ולמגע.</p>
  </div>
  <div class="label">בחרי דמות</div>
  <div class="carousel" id="carousel"></div>
  <button class="cta" id="go">📷 פתחי מצלמה</button>
  <button class="linkbtn" id="goXR" hidden>✨ AR מלא על משטח אמיתי (אנדרואיד)</button>
  <button class="linkbtn" id="goQL" hidden>🍏 תצוגת AR של אייפון (Quick Look)</button>
  <div class="note" id="note"></div>
  <input type="file" id="file" accept=".glb,model/gltf-binary,application/octet-stream" hidden>
</section>

<section id="hud" hidden>
  <div class="topbar">
    <button class="icon glass" id="close" aria-label="סגירה">✕</button>
    <div style="display:flex;gap:8px">
      <button class="icon glass" id="shot" aria-label="צילום">📸</button>
      <button class="icon glass" id="settings" aria-label="הגדרות">⚙️</button>
    </div>
  </div>
  <div id="hint" class="glass">געי במסך כדי להעמיד את הדמות</div>
  <div id="heard" class="glass" style="opacity:0"></div>
  <div class="bottom">
    <button class="mic" id="mic" aria-label="פקודה קולית">🎤</button>
    <div class="actions glass">
      <button class="act" data-a="jump">🦘<small>קפוץ</small></button>
      <button class="act" data-a="dance">💃<small>רקוד</small></button>
      <button class="act" data-a="wave">👋<small>שלום</small></button>
      <button class="act" data-a="come">🫳<small>בוא</small></button>
      <button class="act" data-a="spin">🔄<small>סובב</small></button>
    </div>
  </div>
</section>

<div id="sheetBg" hidden></div>
<section id="sheet" class="glass" hidden>
  <div class="grab"></div>
  <div class="row"><span>גודל הדמות</span><input type="range" id="size" min="0.3" max="3" step="0.05" value="1"></div>
  <div class="row"><span>שפת פקודות קוליות</span><div class="seg" id="lang"><button data-l="he-IL" class="on">עברית</button><button data-l="en-US">English</button></div></div>
  <div class="row"><span>דמות משלי (GLB)</span><button class="pill" id="upload2">העלאה</button></div>
  <div class="row"><span>החלפת דמות</span><button class="pill" id="swap">לבחירה</button></div>
</section>

<div id="loading" hidden><div class="spin"></div></div>
<div id="flash"></div>
<div id="err" hidden><div class="box glass"><h3 id="errT"></h3><div id="errB"></div><button class="cta" style="height:50px;font-size:16px" id="errOk">הבנתי</button></div></div>
<div id="mv" hidden><button class="icon glass" id="mvClose" style="position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;z-index:2">✕</button></div>
<script type="module" src="app.js"></script>
</body></html>
